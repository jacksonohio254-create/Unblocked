<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArcadeVault - Unblocked Games</title>
    <meta name="description" content="A clean, fast unblocked games portal featuring classic arcade, puzzle, retro, and action games playable directly in-browser with iframe support, custom game embeds, and tab disguise." />
    <meta property="og:title" content="ArcadeVault - Unblocked Games" />
    <meta property="og:description" content="A clean, fast unblocked games portal featuring classic arcade, puzzle, retro, and action games playable directly in-browser with iframe support, custom game embeds, and tab disguise." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/app.css">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module">
      // Universal entry point:
      // In Vite dev server (AI Studio), load live TypeScript module
      // On static hosts (GitHub Pages, file://), load compiled ./assets/app.js bundle
      if (window.location.port === '3000' || window.location.hostname.includes('run.app')) {
        import('/src/main.tsx').catch(() => import('./assets/app.js'));
      } else {
        import('./assets/app.js');
      }
    </script>
  </body>
</html>
